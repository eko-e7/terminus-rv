# Pings the owner when a PR opens. PRs from the Claude GitHub App are opened
# under the owner's own account, and GitHub never notifies you about your own
# actions. A comment from github-actions[bot] that @-mentions the owner does
# trigger a web + mobile notification.
name: PR ping

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  ping:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Mention the owner on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR" --repo "$REPO" \
            --body "@eko-e7 🔔 This PR is ready for your review."
